<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор стоимости услуги — Задание 6</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="calculator" aria-labelledby="calculator-title">
      <h1 id="calculator-title">Калькулятор стоимости услуги</h1>
      <p class="description">Выберите тип услуги и укажите количество. Стоимость пересчитывается автоматически.</p>

      <form id="service-form">
        <div class="form-group">
          <label for="quantity">Количество:</label>
          <input id="quantity" name="quantity" type="text" inputmode="numeric" value="1" autocomplete="off">
          <p id="quantity-error" class="error" aria-live="polite"></p>
        </div>

        <fieldset class="form-group">
          <legend>Тип услуги:</legend>

          <label class="choice">
            <input type="radio" name="service-type" value="basic" checked>
            Базовая услуга — 1000 ₽
          </label>

          <label class="choice">
            <input type="radio" name="service-type" value="print">
            Печать — 500 ₽
          </label>

          <label class="choice">
            <input type="radio" name="service-type" value="delivery">
            Доставка — 800 ₽
          </label>
        </fieldset>

        <div id="option-block" class="form-group extra-block" hidden>
          <label for="service-option">Опция печати:</label>
          <select id="service-option" name="service-option">
            <option value="standard">Стандартная — без доплаты</option>
            <option value="urgent">Срочная — +300 ₽</option>
            <option value="premium">Премиум — +700 ₽</option>
          </select>
        </div>

        <div id="property-block" class="form-group extra-block" hidden>
          <label class="choice property-choice">
            <input id="insurance" type="checkbox" name="insurance">
            Добавить страхование — +200 ₽
          </label>
        </div>
      </form>

      <div class="result-box" aria-live="polite">
        <span class="result-label">Стоимость:</span>
        <strong id="total-price">1000 ₽</strong>
      </div>
    </section>
  </main>
</body>
</html>
